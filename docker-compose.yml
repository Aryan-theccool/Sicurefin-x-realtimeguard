services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=http://localhost:5173
      - WS_TOKEN=mysupersecret
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_WS_URL=ws://localhost:4000
      - VITE_API_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  securefin-frontend:
    build: ./SecureFin
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - GEMINI_API_KEY=AIzaSyA858RiGEGM3r2UPemxV5uM85Uy1-PApaU
      - DATABASE_URL=postgresql://neondb_owner:npg_1FOwLhV9xyNo@ep-divine-butterfly-a161utr7-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
